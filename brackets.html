<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ========= META ========= -->
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title data-i18n="brackets">Brackets | Year 7 Cups</title>
  <meta
    name="description"
    data-i18n="bracketsDescription"
    content="Interactive knockout stage brackets for the Year 7 Welsh Cup and Cardiff Cup. View rounds, deadlines, and match results."
  />
  <meta name="theme-color" content="#0077ff" />
  <meta name="color-scheme" content="light dark" />
  <meta name="robots" content="index,follow" />

  <!-- ========= ICONS / FONTS ========= -->
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
    media="print"
    onload="this.media='all'"
  />
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </noscript>

  <!-- ========= STYLES ========= -->
  <link rel="stylesheet" href="style.css" />
  <link rel="preload" as="script" href="script.js" />
  <!-- Utilities moved to style.css -->
</head>

<body class="light">
  <!-- ================= HEADER ================= -->
  <header role="banner">
    <div class="header-top">
      <h1 data-i18n="dashboardTitle" tabindex="0">Year 7 Cups Dashboard 2025</h1>

      <div class="lang-theme-controls">
        <!-- Language Buttons -->
        <div class="lang-switch" role="group" aria-label="Language switch">
          <button id="lang-en" type="button" aria-label="Switch to English">EN</button>
          <button id="lang-cy" type="button" aria-label="Newid i'r Gymraeg">CY</button>
        </div>

        <!-- Theme Toggle -->
        <button
          id="theme-toggle"
          class="dark-toggle"
          type="button"
          aria-label="Toggle dark mode"
          title="Toggle dark mode"
        >☾</button>
      </div>
    </div>

    <!-- ===== NAVIGATION ===== -->
    <nav aria-label="Main navigation" role="navigation">
      <a href="index.html" data-i18n="dashboard">Dashboard</a>
      <a href="teamCard.html" data-i18n="teamDashboard">Team Dashboard</a>
      <a href="brackets.html" class="active" data-i18n="brackets" aria-current="page">Brackets</a>
      <a href="#" id="admin-link" data-i18n="admin">Admin</a>
    </nav>
  </header>

  <!-- ================= MAIN ================= -->
  <main id="main-content" role="main">
    <section
      class="dashboard-overview"
      aria-labelledby="brackets-title"
      role="region"
      aria-describedby="brackets-desc"
    >
      <h2 id="brackets-title" data-i18n="brackets">Brackets</h2>
      <p id="brackets-desc" class="subtitle" data-i18n="viewKnockoutRounds">
        View the knockout rounds, results, and progression for each cup.
      </p>

      <!-- COMPETITION SELECT -->
      <div class="selectors" role="group" aria-label="Select competition">
        <label for="competition-select" data-i18n="selectCompetitionLabel">Select Competition:</label>
        <select id="competition-select" aria-label="Select competition to display" autocomplete="off">
          <option value="Welsh" data-i18n="welshCup">Welsh Cup</option>
          <option value="Cardiff" data-i18n="cardiffCup">Cardiff Cup</option>
          <option value="Friendlies" data-i18n="friendlies">Friendlies</option>
        </select>
      </div>

      <!-- BRACKET DISPLAYS -->
      <div
        id="welsh-bracket-container"
        class="bracket-container"
        role="region"
        aria-label="Welsh Cup Bracket"
        aria-live="polite"
      >
        <div class="loading-placeholder" id="welsh-loading" data-i18n="loadingBrackets">Loading brackets...</div>
      </div>

      <div
        id="cardiff-bracket-container"
        class="bracket-container"
        role="region"
        aria-label="Cardiff Cup Bracket"
        aria-live="polite"
      >
        <div class="loading-placeholder" id="cardiff-loading" data-i18n="loadingBrackets">Loading brackets...</div>
      </div>
    </section>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer role="contentinfo">
    <p>
      © 2025 <span data-i18n="dashboardTitle">Year 7 Cups Dashboard</span> |
      <span data-i18n="builtWith">Built with</span> <span aria-hidden="true">♥</span><span class="sr-only" data-i18n="love">love</span> <span data-i18n="by">by</span>
      <strong data-i18n="author">Ollie</strong>
    </p>
  </footer>

  <!-- ================= SCRIPT ================= -->
  <script src="script.js" defer></script>
  
  <!-- Page-specific script moved to script.js -->

  <noscript>
    <p class="sr-only">JavaScript is required to display brackets dynamically.</p>
  </noscript>
</body>
</html>
