<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ========= META ========= -->
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title data-i18n="brackets">Brackets | Year 7 Cups</title>
  <meta
    name="description"
    data-i18n="bracketsDescription"
    content="Interactive knockout stage brackets for the Year 7 Welsh Cup and Cardiff Cup. View rounds, deadlines, and match results."
  />
  <meta name="theme-color" content="#0077ff" />
  <meta name="color-scheme" content="light dark" />
  <meta name="robots" content="index,follow" />

  <!-- ========= ICONS / FONTS ========= -->
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
    media="print"
    onload="this.media='all'"
  />
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </noscript>

  <!-- ========= STYLES ========= -->
  <link rel="stylesheet" href="style.css" />
  <link rel="preload" as="script" href="script.js" />

  <!-- ========= INLINE UTILITY ========= -->
  <style>
    .sr-only {
      position: absolute !important;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0);
      white-space: nowrap; border: 0;
    }
    /* Smooth fade for bracket loads */
    .bracket-container {
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .bracket-container.loaded {
      opacity: 1;
      transform: translateY(0);
    }
    /* Placeholder state */
    .loading-placeholder {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted, #777);
      font-style: italic;
    }
  </style>
</head>

<body class="light">
  <!-- Skip link for keyboard navigation -->
  <a href="#main-content" class="sr-only">Skip to main content</a>

  <!-- ================= HEADER ================= -->
  <header role="banner">
    <div class="header-top">
      <h1 data-i18n="dashboardTitle" tabindex="0">Year 7 Cups Dashboard 2025</h1>

      <div class="lang-theme-controls">
        <!-- Language Buttons -->
        <div class="lang-switch" role="group" aria-label="Language switch">
          <button id="lang-en" type="button" aria-label="Switch to English">EN</button>
          <button id="lang-cy" type="button" aria-label="Newid i'r Gymraeg">CY</button>
        </div>

        <!-- Theme Toggle -->
        <button
          id="theme-toggle"
          class="dark-toggle"
          type="button"
          aria-label="Toggle dark mode"
          title="Toggle dark mode"
        >☾</button>
      </div>
    </div>

    <!-- ===== NAVIGATION ===== -->
    <nav aria-label="Main navigation" role="navigation">
      <a href="index.html" data-i18n="dashboard">Dashboard</a>
      <a href="teamCard.html" data-i18n="teamDashboard">Team Dashboard</a>
      <a href="brackets.html" class="active" data-i18n="brackets" aria-current="page">Brackets</a>
      <a href="#" id="admin-link" data-i18n="admin">Admin</a>
    </nav>
  </header>

  <!-- ================= MAIN ================= -->
  <main id="main-content" role="main">
    <section
      class="dashboard-overview"
      aria-labelledby="brackets-title"
      role="region"
      aria-describedby="brackets-desc"
    >
      <h2 id="brackets-title" data-i18n="brackets">Brackets</h2>
      <p id="brackets-desc" class="subtitle">
        View the knockout rounds, results, and progression for each cup.
      </p>

      <!-- COMPETITION SELECT -->
      <div class="selectors" role="group" aria-label="Select competition">
        <label for="competition-select" data-i18n="selectCompetitionLabel">Select Competition:</label>
        <select id="competition-select" aria-label="Select competition to display" autocomplete="off">
          <option value="Welsh" data-i18n="welshCup">Welsh Cup</option>
          <option value="Cardiff" data-i18n="cardiffCup">Cardiff Cup</option>
          <option value="Friendlies" data-i18n="friendlies">Friendlies</option>
        </select>
      </div>

      <!-- BRACKET DISPLAYS -->
      <div
        id="welsh-bracket-container"
        class="bracket-container"
        role="region"
        aria-label="Welsh Cup Bracket"
        aria-live="polite"
      >
        <div class="loading-placeholder" id="welsh-loading" data-i18n="loadingBrackets">Loading brackets...</div>
      </div>

      <div
        id="cardiff-bracket-container"
        class="bracket-container"
        role="region"
        aria-label="Cardiff Cup Bracket"
        aria-live="polite"
      >
        <div class="loading-placeholder" id="cardiff-loading" data-i18n="loadingBrackets">Loading brackets...</div>
      </div>
    </section>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer role="contentinfo">
    <p>
      © 2025 <span data-i18n="dashboardTitle">Year 7 Cups Dashboard</span> |
      <span data-i18n="builtWith">Built with</span> <span aria-hidden="true">♥</span><span class="sr-only" data-i18n="love">love</span> <span data-i18n="by">by</span>
      <strong data-i18n="author">Ollie</strong>
    </p>
  </footer>

  <!-- ================= SCRIPT ================= -->
  <script src="script.js" defer></script>

  <!-- Smooth bracket load once data arrives -->
  <!--
    What this inline script does (quick overview):
    - Logs page/DOM readiness and when brackets become visible
    - Observes bracket containers for content changes
    - Logs selector changes and navigation interactions
    - Prints performance and accessibility summaries

    How to debug quickly:
    - Look for lines marked "DEBUG:" and remove the slashes
      to print extra objects (e.g., all nav links, sample content)
  -->
  <script>
    // Page load logging
    console.log('[PAGE] brackets.html loaded', {
      timestamp: new Date().toISOString(),
      userAgent: navigator.userAgent,
      viewport: { width: window.innerWidth, height: window.innerHeight },
      language: navigator.language,
      online: navigator.onLine
    });
    // DEBUG: dump document title / URL
    // console.log('[PAGE] details', { title: document.title, url: location.href });

    document.addEventListener("DOMContentLoaded", () => {
      console.log('[BRACKETS] DOM ready, initializing bracket system', {
        timestamp: new Date().toISOString()
      });

      const welsh = document.getElementById("welsh-bracket-container");
      const cardiff = document.getElementById("cardiff-bracket-container");

      console.log('[BRACKETS] Bracket containers found', {
        welsh: !!welsh,
        cardiff: !!cardiff,
        timestamp: new Date().toISOString()
      });
      // DEBUG: ensure IDs exist
      // console.log('[BRACKETS] ids', { welshId: welsh?.id, cardiffId: cardiff?.id });

      const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
          if (mutation.type === 'childList') {
            console.log('[BRACKETS] DOM mutation detected', {
              target: mutation.target.id || 'unknown',
              addedNodes: mutation.addedNodes.length,
              removedNodes: mutation.removedNodes.length,
              timestamp: new Date().toISOString()
            });
          }
        });

        if (welsh.innerHTML.trim() && !welsh.classList.contains("loaded")) {
          console.log('[BRACKETS] Welsh bracket loaded and displayed', {
            contentLength: welsh.innerHTML.length,
            timestamp: new Date().toISOString()
          });
          welsh.classList.add("loaded");
          const loadMsg = document.getElementById("welsh-loading");
          if (loadMsg) {
            console.log('[BRACKETS] Removing Welsh loading message');
            loadMsg.remove();
          }
        }
        if (cardiff.innerHTML.trim() && !cardiff.classList.contains("loaded")) {
          console.log('[BRACKETS] Cardiff bracket loaded and displayed', {
            contentLength: cardiff.innerHTML.length,
            timestamp: new Date().toISOString()
          });
          cardiff.classList.add("loaded");
          const loadMsg = document.getElementById("cardiff-loading");
          if (loadMsg) {
            console.log('[BRACKETS] Removing Cardiff loading message');
            loadMsg.remove();
          }
        }
      });

      observer.observe(welsh, { childList: true, subtree: true });
      observer.observe(cardiff, { childList: true, subtree: true });

      console.log('[BRACKETS] Mutation observers set up', {
        welshObserved: true,
        cardiffObserved: true,
        timestamp: new Date().toISOString()
      });

      // Competition selector logging
      const select = document.getElementById("competition-select");
      if (select) {
        console.log('[BRACKETS] Competition selector found', {
          options: select.options.length,
          currentValue: select.value,
          timestamp: new Date().toISOString()
        });

        select.addEventListener("change", () => {
          const value = select.value;
          console.log('[BRACKETS] Competition changed', {
            newValue: value,
            previousWelshDisplay: welsh.style.display,
            previousCardiffDisplay: cardiff.style.display,
            timestamp: new Date().toISOString()
          });
          // DEBUG: verify container HTML lengths
          // console.log('[BRACKETS] lengths', { welsh: welsh.innerHTML.length, cardiff: cardiff.innerHTML.length });

          welsh.style.display = value === "Welsh" ? "block" : "none";
          cardiff.style.display = value === "Cardiff" ? "block" : "none";

          console.log('[BRACKETS] Bracket visibility updated', {
            welshVisible: welsh.style.display !== 'none',
            cardiffVisible: cardiff.style.display !== 'none',
            timestamp: new Date().toISOString()
          });
        });
      } else {
        console.warn('[BRACKETS] Competition selector not found');
      }

      // Default: show Welsh Cup first
      welsh.style.display = "block";
      cardiff.style.display = "none";
      console.log('[BRACKETS] Default view set to Welsh Cup', {
        welshVisible: true,
        cardiffVisible: false,
        timestamp: new Date().toISOString()
      });

      // Language and theme controls logging
      const langButtons = document.querySelectorAll('.lang-switch button');
      console.log('[BRACKETS] Language buttons found', {
        count: langButtons.length,
        buttons: Array.from(langButtons).map(btn => btn.textContent),
        timestamp: new Date().toISOString()
      });
      // DEBUG: track current language
      // console.log('[BRACKETS] html lang', document.documentElement.lang);

      langButtons.forEach((btn, index) => {
        btn.addEventListener('click', () => {
          console.log('[BRACKETS] Language button clicked', {
            button: btn.textContent,
            index: index,
            timestamp: new Date().toISOString()
          });
        });
      });

      const themeToggle = document.getElementById('theme-toggle');
      if (themeToggle) {
        themeToggle.addEventListener('click', () => {
          console.log('[BRACKETS] Theme toggle clicked', {
            currentTheme: document.body.className,
            timestamp: new Date().toISOString()
          });
        });
      }

      // Navigation logging
      const navLinks = document.querySelectorAll('nav a');
      console.log('[BRACKETS] Navigation links found', {
        count: navLinks.length,
        activeLink: document.querySelector('nav a.active')?.textContent,
        timestamp: new Date().toISOString()
      });
      // DEBUG: print all nav link texts
      // console.log('[BRACKETS] nav texts', Array.from(navLinks).map(n => n.textContent.trim()));

      navLinks.forEach((link, index) => {
        link.addEventListener('click', () => {
          console.log('[BRACKETS] Navigation link clicked', {
            text: link.textContent,
            href: link.href,
            index: index,
            timestamp: new Date().toISOString()
          });
        });
      });

      // Performance logging
      if (window.performance) {
        const perfData = window.performance.getEntriesByType('navigation')[0];
        console.log('[BRACKETS] Page performance', {
          loadTime: perfData.loadEventEnd - perfData.loadEventStart,
          domContentLoaded: perfData.domContentLoadedEventEnd - perfData.domContentLoadedEventStart,
          firstPaint: performance.getEntriesByType('paint').find(entry => entry.name === 'first-paint')?.startTime,
          firstContentfulPaint: performance.getEntriesByType('paint').find(entry => entry.name === 'first-contentful-paint')?.startTime,
          timestamp: new Date().toISOString()
        });
        // DEBUG: dump nav timing
        // console.log('[BRACKETS] navigation entry', perfData);
      }

      // Accessibility logging
      console.log('[BRACKETS] Accessibility features', {
        skipLinks: document.querySelectorAll('.sr-only').length,
        ariaLabels: document.querySelectorAll('[aria-label]').length,
        roleAttributes: document.querySelectorAll('[role]').length,
        liveRegions: document.querySelectorAll('[aria-live]').length,
        timestamp: new Date().toISOString()
      });
    });

    // Error logging
    window.addEventListener('error', (event) => {
      console.log('[BRACKETS] JavaScript error', {
        message: event.message,
        filename: event.filename,
        lineno: event.lineno,
        colno: event.colno,
        timestamp: new Date().toISOString()
      });
    });

    // Unhandled promise rejection logging
    window.addEventListener('unhandledrejection', (event) => {
      console.log('[BRACKETS] Unhandled promise rejection', {
        reason: event.reason,
        timestamp: new Date().toISOString()
      });
    });

    // Resize logging for responsive bracket display
    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        console.log('[BRACKETS] Window resized', {
          width: window.innerWidth,
          height: window.innerHeight,
          welshVisible: document.getElementById("welsh-bracket-container")?.style.display !== 'none',
          cardiffVisible: document.getElementById("cardiff-bracket-container")?.style.display !== 'none',
          timestamp: new Date().toISOString()
        });
        // DEBUG: show orientation
        // console.log('[BRACKETS] orientation', window.innerWidth > window.innerHeight ? 'landscape' : 'portrait');
      }, 250);
    });
  </script>

  <noscript>
    <p class="sr-only">JavaScript is required to display brackets dynamically.</p>
  </noscript>
</body>
</html>
