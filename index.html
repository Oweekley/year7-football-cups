<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ===== META & TITLE ===== -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="dashboardTitle">Year 7 Cups Dashboard 2025</title>
  <meta name="description" content="Interactive bilingual dashboard for the Year 7 Football Cups — Welsh Cup, Cardiff Cup, and Friendlies. Auto-updating stats, live tables, and knockout brackets." />
  <meta name="theme-color" content="#0077ff" />

  <!-- ===== FAVICON & STYLES ===== -->
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="stylesheet" href="style.css" />

  <!-- ===== PRECONNECT (Performance Boost) ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body class="light">
  <!-- ================= HEADER ================= -->
  <header>
    <div class="header-top">
      <h1 data-i18n="dashboardTitle" tabindex="0">Year 7 Cups Dashboard 2025</h1>

      <div class="lang-theme-controls">
        <!-- Language Buttons -->
        <div class="lang-switch" role="group" aria-label="Language Switch">
          <button id="lang-en" aria-label="Switch to English">EN</button>
          <button id="lang-cy" aria-label="Newid i'r Gymraeg">CY</button>
        </div>

        <!-- Theme Toggle -->
        <button id="theme-toggle" class="dark-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
      </div>
    </div>

    <!-- ===== NAVIGATION ===== -->
    <nav aria-label="Main Navigation">
      <a href="index.html" class="active" data-i18n="dashboard" aria-current="page">Dashboard</a>
      <a href="teamCard.html" data-i18n="teamDashboard">Team Dashboard</a>
      <a href="brackets.html" data-i18n="brackets">Brackets</a>
    </nav>
  </header>

  <!-- ================= MAIN CONTENT ================= -->
  <main>
    <!-- ====== DASHBOARD OVERVIEW ====== -->
    <section id="overview" class="dashboard-overview" aria-labelledby="overview-title">
      <div class="overview-header">
        <h2 id="overview-title" data-i18n="dashboardTitle">Year 7 Cups Dashboard 2025</h2>
        <div class="data-controls">
          <button id="refresh-btn" class="refresh-btn" data-i18n="refresh" aria-live="polite">Refresh Data</button>
          <p id="last-updated" class="last-updated" data-i18n="lastUpdated">Last Updated: --</p>
        </div>
      </div>

      <!-- Leaderboard -->
      <div id="leaderboard" class="leaderboard-section" aria-live="polite">
        <!-- Leaderboard dynamically rendered here -->
      </div>
    </section>

    <!-- ====== WELSH CUP ====== -->
    <section class="cup-section" id="welsh-cup" aria-labelledby="welsh-title">
      <h2 id="welsh-title" data-i18n="welshCupOverview">Welsh Cup Overview</h2>
      <div class="selectors">
        <div>
          <label for="welsh-team" data-i18n="selectTeam">Select Team:</label>
          <select id="welsh-team" aria-label="Select Welsh Cup team">
            <option value="">--Choose a Team--</option>
          </select>
        </div>
        <div>
          <label for="welsh-data" data-i18n="selectData">Select Data:</label>
          <select id="welsh-data" aria-label="Select Welsh Cup data type">
            <option value="">--Team Stats / Match History--</option>
          </select>
        </div>
      </div>
      <div class="dynamic-display" id="welsh-display" aria-live="polite">
        <!-- Welsh Cup stats / matches will be injected here -->
      </div>
    </section>

    <!-- ====== CARDIFF CUP ====== -->
    <section class="cup-section" id="cardiff-cup" aria-labelledby="cardiff-title">
      <h2 id="cardiff-title" data-i18n="cardiffCupOverview">Cardiff Cup Overview</h2>
      <div class="selectors">
        <div>
          <label for="cardiff-team" data-i18n="selectTeam">Select Team:</label>
          <select id="cardiff-team" aria-label="Select Cardiff Cup team">
            <option value="">--Choose a Team--</option>
          </select>
        </div>
        <div>
          <label for="cardiff-data" data-i18n="selectData">Select Data:</label>
          <select id="cardiff-data" aria-label="Select Cardiff Cup data type">
            <option value="">--Team Stats / Match History--</option>
          </select>
        </div>
      </div>
      <div class="dynamic-display" id="cardiff-display" aria-live="polite">
        <!-- Cardiff Cup stats / matches will be injected here -->
      </div>
    </section>

    <!-- ====== FRIENDLIES ====== -->
    <section class="cup-section" id="friendlies" aria-labelledby="friendlies-title">
      <h2 id="friendlies-title" data-i18n="friendliesOverview">Friendlies Overview</h2>
      <div class="selectors">
        <div>
          <label for="friendlies-team" data-i18n="selectTeam">Select Team:</label>
          <select id="friendlies-team" aria-label="Select Friendlies team">
            <option value="">--Choose a Team--</option>
          </select>
        </div>
        <div>
          <label for="friendlies-data" data-i18n="selectData">Select Data:</label>
          <select id="friendlies-data" aria-label="Select Friendlies data type">
            <option value="">--Team Stats / Match History--</option>
          </select>
        </div>
      </div>
      <div class="dynamic-display" id="friendlies-display" aria-live="polite">
        <!-- Friendlies stats / matches will be injected here -->
      </div>
    </section>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer>
    <p>© 2025 <span data-i18n="dashboardTitle">Year 7 Cups Dashboard</span> | Built with ❤️ by <strong>Ollie</strong></p>
  </footer>

  <!-- ================= SCRIPTS ================= -->
  <script src="script.js" defer></script>
</body>
</html>
