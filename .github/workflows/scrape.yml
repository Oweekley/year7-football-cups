name: Run Scraper and Update Data

on:
  workflow_dispatch:   # 👈 adds the "Run workflow" button
  schedule:
    - cron: "0 6 * * *"  # optional: runs every day at 6am UTC

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22  # use your local Node version

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        run: node scraper.js

      - name: Commit and push updated JSON files
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add welsh.json cardiff.json teams.json
          git commit -m "Auto-update JSON data from scraper" || echo "No changes to commit"
          git push
