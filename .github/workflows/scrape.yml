name: Scrape Fixtures
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Run scraper
        run: node scraper.js

      - name: Commit JSON outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add welsh.json cardiff.json teams.json friendlies.json last_updated.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Update cup JSON via workflow"
            git push
          else
            echo "No JSON changes to commit."
          fi
