name: Run Scraper

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Triggered by admin page or manually'
        required: false
        default: 'manual'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        run: node scraper.js

      - name: Commit and push updates
        run: |
          git config user.name "GitHub Action"
          git config user.email "actions@github.com"
          git add *.json
          git commit -m "🤖 Auto update JSONs from scraper"
          git push
