name: Update Fixtures
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci
        env:
          CI: true

      - name: Run scraper
        run: node scraper.js

      - name: Update last_updated.json (Europe/London)
        run: |
          node -e "const d=new Date().toLocaleString('en-GB',{timeZone:'Europe/London'}); require('fs').writeFileSync('last_updated.json', JSON.stringify({lastUpdated:d}, null,2)+'\n')"

      - name: Check for changes
        id: git_status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit & push (if changed)
        if: steps.git_status.outputs.changed == 'true'
        run: |
          git commit -m "chore: update fixtures (CI)"
          git push
