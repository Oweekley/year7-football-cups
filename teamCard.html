<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="teamDashboard">Team Dashboard | Year 7 Cups</title>
  <meta name="description" content="View detailed stats, match history, and performance for every team in the Year 7 Football Cups." />
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body class="light">
  <!-- ================= HEADER ================= -->
  <header>
    <div class="header-top">
      <h1 data-i18n="teamDashboard">Team Dashboard</h1>

      <div class="lang-theme-controls">
        <div class="lang-switch" role="group" aria-label="Language Switch">
          <button id="lang-en" aria-label="Switch to English">EN</button>
          <button id="lang-cy" aria-label="Newid i'r Gymraeg">CY</button>
        </div>
        <button id="theme-toggle" class="dark-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
      </div>
    </div>

    <nav aria-label="Main Navigation">
      <a href="index.html" data-i18n="dashboard">Dashboard</a>
      <a href="teamCard.html" class="active" aria-current="page" data-i18n="teamDashboard">Team Dashboard</a>
      <a href="brackets.html" data-i18n="brackets">Brackets</a>
    </nav>
  </header>

  <!-- ================= MAIN ================= -->
  <main>
    <section class="dashboard-overview" aria-labelledby="team-dashboard-title">
      <h2 id="team-dashboard-title" data-i18n="teamDashboard">Team Dashboard</h2>
      <p class="subtitle">Explore combined stats and match history for each team across all competitions.</p>

      <!-- TEAM SELECT -->
      <div class="selectors">
        <div>
          <label for="team-select" data-i18n="selectTeam">Select Team:</label>
          <select id="team-select" aria-label="Select Team">
            <option value="">--Choose a Team--</option>
          </select>
        </div>

        <div>
          <label for="data-select" data-i18n="selectData">Select Data:</label>
          <select id="data-select" aria-label="Select Data Type">
            <option value="">--Team Stats / Match History--</option>
          </select>
        </div>
      </div>

      <!-- TEAM DISPLAY -->
      <div class="dynamic-display" id="team-display" aria-live="polite">
        <!-- Team stats or match history will render here -->
      </div>
    </section>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer>
    <p>© 2025 <span data-i18n="dashboardTitle">Year 7 Cups Dashboard</span> | Built with ❤️ by <strong>Ollie</strong></p>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
